                                <form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">

    <!-- 标题 -->
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">Title:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-title"
                   data-rule="required"
                   class="form-control"
                   name="row[title]"
                   type="text"
                   placeholder="请输入标题">
        </div>
    </div>

    <!-- 类型 -->
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">类型:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-type"
                    data-rule="required"
                    class="form-control selectpicker"
                    name="row[type]">

                <option value="1">公告（首页广播）</option>
                <option value="2">帮助中心</option>
                <option value="3">隐私政策</option>
                <option value="4">合同简介</option>

            </select>
        </div>
    </div>

    <!-- 简介 -->
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">Short_content:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-short_content"
                   class="form-control"
                   name="row[short_content]"
                   type="text"
                   placeholder="可选，用于列表简介">
        </div>
    </div>

    <!-- 内容 -->
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">Content:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-content"
                      data-rule="required"
                      class="form-control editor"
                      rows="8"
                      name="row[content]"
                      cols="50"
                      placeholder="请输入正文内容"></textarea>
        </div>
    </div>

    <!-- 排序 -->
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">Rank:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-rank"
                   class="form-control"
                   name="row[rank]"
                   type="number"
                   value="1000">
            <span class="help-block">
                数值越大，排序越靠前（首页公告建议设置更大）
            </span>
        </div>
    </div>

    <!-- 状态 -->
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">Status:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-status"
                    data-rule="required"
                    class="form-control selectpicker"
                    name="row[status]">
                <option value="1">启用</option>
                <option value="0">禁用</option>
            </select>
        </div>
    </div>

    <!-- 提交 -->
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>

                    class="btn btn-success btn-embossed disabled">
                OK            </button>
            <button type="reset"
                    class="btn btn-default btn-embossed">
                Reset            </button>
        </div>
    </div>
