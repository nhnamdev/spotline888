/* ===== Dashboard Reset ===== */
.dash-wrap { padding: 0; }
.dash-wrap *,
.dash-wrap *::before,
.dash-wrap *::after { box-sizing: border-box; }

/* ===== Summary Banner ===== */
.dash-summary {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border-radius: 12px;
    padding: 18px 28px;
    margin-bottom: 22px;
    color: #fff;
    flex-wrap: wrap;
    gap: 10px;
}
.dash-summary .sum-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
}
.dash-summary .sum-item strong {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -.5px;
}
.dash-summary .sum-item i {
    font-size: 20px;
    opacity: .85;
}

/* ===== Time Filter ===== */
.dash-filter {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 22px;
    flex-wrap: wrap;
}
.dash-filter .input-group {
    max-width: 440px;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
}
.dash-filter .input-group .form-control {
    border: 1px solid #e0e6ed;
    height: 38px;
    font-size: 13px;
}
.dash-filter .input-group .input-group-addon {
    background: #f7f9fc;
    border: 1px solid #e0e6ed;
    color: #667eea;
    font-size: 13px;
}
.dash-filter .btn-query {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 8px 24px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .2s;
}
.dash-filter .btn-query:hover { opacity: .88; }

/* ===== Stat Cards Grid ===== */
.dash-cards {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 16px;
    margin-bottom: 26px;
}
@media (max-width: 1400px) { .dash-cards { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 768px) { .dash-cards { grid-template-columns: repeat(2, 1fr); } }

.dash-card {
    position: relative;
    background: #fff;
    border-radius: 14px;
    padding: 22px 20px 18px;
    overflow: hidden;
    box-shadow: 0 2px 12px rgba(0,0,0,.06);
    transition: transform .2s, box-shadow .2s;
}
.dash-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 20px rgba(0,0,0,.1);
}
.dash-card .card-deco {
    position: absolute;
    top: -16px;
    right: -16px;
    width: 72px;
    height: 72px;
    border-radius: 50%;
    opacity: .12;
}
.dash-card .card-icon {
    width: 42px;
    height: 42px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    color: #fff;
    margin-bottom: 14px;
}
.dash-card .card-val {
    font-size: 26px;
    font-weight: 700;
    color: #1e293b;
    line-height: 1.1;
    margin-bottom: 4px;
    font-variant-numeric: tabular-nums;
}
.dash-card .card-val-sm {
    font-size: 15px;
    font-weight: 600;
    color: #1e293b;
    line-height: 1.5;
    font-variant-numeric: tabular-nums;
}
.dash-card .card-label {
    font-size: 12px;
    color: #94a3b8;
    font-weight: 500;
    letter-spacing: .3px;
}
.dash-card .card-sub {
    font-size: 11px;
    color: #94a3b8;
    margin-top: 2px;
}
.dash-card .card-link {
    display: block;
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid #f1f5f9;
    font-size: 12px;
    color: #667eea;
    text-decoration: none;
    font-weight: 500;
}
.dash-card .card-link:hover { color: #764ba2; }

/* Card color themes */
.card-icon.ci-blue     { background: linear-gradient(135deg, #667eea, #5a67d8); }
.card-icon.ci-green    { background: linear-gradient(135deg, #48bb78, #38a169); }
.card-icon.ci-amber    { background: linear-gradient(135deg, #f6ad55, #ed8936); }
.card-icon.ci-rose     { background: linear-gradient(135deg, #fc8181, #e53e3e); }
.card-icon.ci-cyan     { background: linear-gradient(135deg, #4fd1c5, #38b2ac); }
.card-icon.ci-purple   { background: linear-gradient(135deg, #9f7aea, #805ad5); }

.card-deco.cd-blue     { background: #667eea; }
.card-deco.cd-green    { background: #48bb78; }
.card-deco.cd-amber    { background: #f6ad55; }
.card-deco.cd-rose     { background: #e53e3e; }
.card-deco.cd-cyan     { background: #4fd1c5; }
.card-deco.cd-purple   { background: #9f7aea; }

/* ===== Charts Section ===== */
.dash-charts {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 20px;
}
@media (max-width: 992px) { .dash-charts { grid-template-columns: 1fr; } }

.dash-chart-box {
    background: #fff;
    border-radius: 14px;
    padding: 22px 24px;
    box-shadow: 0 2px 12px rgba(0,0,0,.06);
}
.dash-chart-box .chart-hd {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
}
.dash-chart-box .chart-title {
    font-size: 15px;
    font-weight: 700;
    color: #1e293b;
}
.dash-chart-box .chart-badge {
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 20px;
    background: #f1f5f9;
    color: #64748b;
    font-weight: 500;
}
.chart-area {
    width: 100%;
    height: 260px;
}

/* ===== Online pulse dot ===== */
.pulse-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #48bb78;
    margin-right: 4px;
    animation: pulseDot 1.5s infinite;
    vertical-align: middle;
}
@keyframes pulseDot {
    0%   { box-shadow: 0 0 0 0 rgba(72,187,120,.6); }
    70%  { box-shadow: 0 0 0 8px rgba(72,187,120,0); }
    100% { box-shadow: 0 0 0 0 rgba(72,187,120,0); }
}
</style>
